plugins {
    id 'net.neoforged.moddev' version '2.0.42-beta'
}

version = project.mod_version
group = project.mod_group_id
base.archivesName = project.mod_id
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
neoForge.version = project.neo_version

repositories {
    mavenCentral()
    maven { url = 'https://maven.neoforged.net/releases' }
}

// The generator and checks share the runtime decoder but need no Minecraft classes.
sourceSets {
    patchTool {
        java.srcDirs = ['src/patchTool/java', 'src/main/java']
        java.include '**/GenerateVoxyPatch.java', '**/XorPatch.java'
    }
    verification {
        compileClasspath = sourceSets.patchTool.output
        runtimeClasspath = output + compileClasspath
    }
}

tasks.withType(JavaCompile).configureEach {
    options.encoding = 'UTF-8'
    options.release = 21
}

def sourceJar = providers.gradleProperty('sourceJar').map { file(it) }
def targetJar = file(project.voxy_target_jar)
def generatedPatchDir = layout.buildDirectory.dir('generated/voxyPatch')

def generatePatch = tasks.register('generateVoxyPatch', JavaExec) {
    group = 'build'
    description = 'Generates the Voxy XOR resource from the supplied local source JAR.'
    classpath = sourceSets.patchTool.runtimeClasspath
    mainClass = 'com.aerosmp.inittransformer.GenerateVoxyPatch'
    inputs.files(sourceJar).withPropertyName('sourceJar').optional()
    inputs.file(targetJar).withPropertyName('targetJar')
    inputs.property('sourceFilename', project.voxy_source_filename)
    inputs.property('sourceSha256', project.voxy_source_sha256)
    outputs.dir(generatedPatchDir)

    doFirst {
        if (!sourceJar.isPresent()) {
            throw new GradleException('Supply the pinned local Voxy source with -PsourceJar=/path/to/source.jar')
        }
        setArgs([
                sourceJar.get().absolutePath,
                targetJar.absolutePath,
                project.voxy_source_filename + '.source',
                project.voxy_source_sha256,
                generatedPatchDir.get().file('aerosmp/voxy.xor').asFile.absolutePath
        ])
    }
}

sourceSets.main.resources.srcDir(generatePatch)

tasks.named('processResources') {
    def metadata = ['minecraft_version', 'neo_version', 'loader_version_range',
                    'mod_id', 'mod_name', 'mod_license', 'mod_version']
            .collectEntries { [(it): project.property(it)] }
    inputs.properties(metadata)
    filesMatching('META-INF/neoforge.mods.toml') { expand metadata }
}

tasks.named('jar') {
    includeEmptyDirs = false
    from('LICENSE') { rename { "${it}_${project.mod_id}" } }
}

tasks.register('verifyVoxyPatch', JavaExec) {
    group = 'verification'
    description = 'Verifies packaged XOR reconstruction, cache reuse, and failure handling.'
    dependsOn tasks.named('jar')
    classpath = sourceSets.verification.runtimeClasspath
    mainClass = 'com.aerosmp.inittransformer.XorPatchVerification'
    doFirst {
        setArgs([tasks.named('jar').get().archiveFile.get().asFile.absolutePath,
                 sourceJar.get().absolutePath, targetJar.absolutePath])
    }
}

tasks.named('check') { dependsOn tasks.named('verifyVoxyPatch') }
